<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervisión — HSLV Contratación</title>

    <script defer src="/js/vendor/supabase-js.js"></script>
    <script defer src="/js/supabase.js"></script>
    <script defer src="/js/auth-guard.js"></script>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <button id="sidebar-toggle" style="display:flex;align-items:center;justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
    </button>
    <div class="sidebar"></div>

    <div class="content">

        <!-- TOPBAR -->
        <div class="topbar" style="flex-direction:column;align-items:center;
                            text-align:center;gap:6px;">
    <div style="font-size:28px;font-weight:900;color:#046A38;
                letter-spacing:1px;">
        ÁGORA <span style="color:#123C7B;">HSLV</span>
    </div>
    <div style="width:60px;height:3px;
                background:linear-gradient(90deg,#046A38,#123C7B);
                border-radius:2px;"></div>
    <h1 style="margin:0;font-size:20px;font-weight:800;color:#123C7B;">
        Registrar Supervisión
    </h1>
    <p style="margin:0;color:#6B7280;font-size:13px;">
        Complete los datos del supervisor y del contrato
    </p>
</div>

        <!-- CONTENIDO PRINCIPAL -->
        <div style="max-width:800px;margin:0 auto;">

            <!-- Sección Supervisor -->
            <div style="background:#F0FBF4;border:1px solid #C7EFD4;
                        border-radius:14px;padding:18px;margin-bottom:18px;">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
                    <span style="color:#0B7A43;display:inline-flex;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
                    <span style="font-size:14px;font-weight:800;color:#0B7A43;
                                 text-transform:uppercase;letter-spacing:.5px;">
                        Datos del Supervisor
                    </span>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
                    <div class="form-group" style="margin-bottom:0;">
                        <label style="color:#0B7A43;font-size:13px;">
                            Nombre Completo del Supervisor
                        </label>
                        <input type="text" id="sup_nombre"
                            class="campo-hslv campo-hslv-verde"
                            placeholder="Ej: Juan Carlos Pérez López"
                            style="border-radius:10px;
                                   padding:11px 13px;font-size:13px;width:100%;">
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label style="color:#0B7A43;font-size:13px;">
                            Área del Supervisor
                        </label>
                        <input type="text" id="sup_area"
                            class="campo-hslv campo-hslv-verde"
                            placeholder="Ej: Subdirección Administrativa"
                            style="border-radius:10px;
                                   padding:11px 13px;font-size:13px;width:100%;">
                    </div>
                </div>

                <!-- Preview supervisor -->
                <div id="sup_preview"
                    style="display:none;margin-top:12px;background:white;
                           border:1px solid #BBF7D0;border-radius:10px;
                           padding:10px 14px;align-items:center;gap:10px;">
                    <span style="color:#0B7A43;display:inline-flex;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></span>
                    <div>
                        <div style="font-size:12px;color:#0B7A43;font-weight:700;"
                             id="sup_preview_nombre"></div>
                        <div style="font-size:11px;color:#6B7280;"
                             id="sup_preview_area"></div>
                    </div>
                </div>
            </div>

            <!-- Sección Contrato -->
            <div style="background:#EFF6FF;border:1px solid #BFDBFE;
                        border-radius:14px;padding:18px;margin-bottom:18px;">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
                    <span style="color:#123C7B;display:inline-flex;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg></span>
                    <span style="font-size:14px;font-weight:800;color:#123C7B;
                                 text-transform:uppercase;letter-spacing:.5px;">
                        Datos del Contrato
                    </span>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
                    <div class="form-group" style="margin-bottom:0;">
                        <label style="color:#123C7B;font-size:13px;">
                            Número de Contrato
                        </label>
                        <input type="text" id="sup_contrato"
                            class="campo-hslv campo-hslv-azul"
                            placeholder="Ej: CD1P-0012-2025"
                            style="border-radius:10px;
                                   padding:11px 13px;font-size:13px;width:100%;">
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label style="color:#123C7B;font-size:13px;">
                            Avance Físico (%)
                        </label>
                        <input type="number" id="sup_avance"
                            class="campo-hslv campo-hslv-azul"
                            min="0" max="100" placeholder="0 - 100"
                            data-accion="supActualizarBarra"
                            data-evento="input"
                            data-args='["@valor"]'
                            style="border-radius:10px;
                                   padding:11px 13px;font-size:13px;width:100%;">
                        <!-- Barra avance -->
                        <div style="margin-top:8px;height:8px;background:#DBEAFE;
                                    border-radius:6px;overflow:hidden;">
                            <div id="sup_barra"
                                style="height:100%;width:0%;
                                       background:linear-gradient(90deg,#0B7A43,#123C7B);
                                       border-radius:6px;transition:width .3s;"></div>
                        </div>
                        <div id="sup_pct_label"
                            style="font-size:11px;color:#6B7280;
                                   margin-top:4px;text-align:right;">0%</div>
                    </div>
                </div>
            </div>

            <!-- Hallazgos -->
            <div class="form-group" style="margin-bottom:18px;">
                <label style="color:#123C7B;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    Hallazgos y Observaciones
                </label>
                <textarea id="sup_hallazgos" rows="5"
                    class="campo-hslv campo-hslv-gris"
                    placeholder="Describa los hallazgos, observaciones o novedades
identificadas durante la supervisión…"
                    style="border-radius:12px;
                           padding:13px;font-size:13px;width:100%;resize:vertical;
                           min-height:120px;"></textarea>
            </div>

            <!-- Botones -->
            <div style="display:flex;justify-content:flex-end;
                        gap:12px;flex-wrap:wrap;
                        border-top:1px solid #E5E7EB;padding-top:18px;">
                <button class="btn"
                    data-accion="navegar" data-args='["/dashboard"]'
                    style="background:#F3F4F6;color:#374151;
                           border:none;min-width:140px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:5px;" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Volver al Dashboard
                </button>
                <button class="btn"
                    data-accion="supLimpiar"
                    style="background:white;color:#0B7A43;
                           border:2px solid #86d19d;min-width:140px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:5px;" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
                    Limpiar
                </button>
                <button class="btn finalizar-btn"
                    data-accion="registrarSupervision"
                    style="background:linear-gradient(90deg,#0B7A43,#123C7B);
                           color:white;min-width:200px;font-size:15px;">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:5px;" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                    Registrar Supervisión
                </button>
            </div>

        </div><!-- fin max-width -->

    </div><!-- fin content -->

    <script defer src="/js/acciones.js"></script>
    <script defer src="/js/sidebar.js"></script>
    <script defer src="/js/db.js"></script>
    <script defer src="/js/notificaciones.js"></script>
    <script defer src="/js/juriskills-engine.js"></script>
    <script defer src="/js/script.js"></script>

</body>
</html>
